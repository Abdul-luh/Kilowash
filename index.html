    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body { background: #dde8ea; font-family: 'Plus Jakarta Sans', sans-serif; color: #0b3c42; overflow-x: hidden; width: 100%; }
      ::-webkit-scrollbar { display: none; }
      .marquee-track { display: flex; width: max-content; }

      @keyframes brownian1 {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        20%      { transform: translate3d(6px, -10px, 0) rotate(2deg); }
        40%      { transform: translate3d(-7px, -4px, 0) rotate(-1.5deg); }
        60%      { transform: translate3d(5px, 8px, 0) rotate(1deg); }
        80%      { transform: translate3d(-5px, -6px, 0) rotate(-2deg); }
      }
      @keyframes brownian2 {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        25%      { transform: translate3d(-7px, 8px, 0) rotate(-2deg); }
        50%      { transform: translate3d(6px, -9px, 0) rotate(2.5deg); }
        75%      { transform: translate3d(-4px, -6px, 0) rotate(-1deg); }
      }
      @keyframes brownian3 {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        30%      { transform: translate3d(8px, 6px, 0) rotate(1.5deg); }
        55%      { transform: translate3d(-6px, -10px, 0) rotate(-2deg); }
        80%      { transform: translate3d(5px, -4px, 0) rotate(2deg); }
      }
      @keyframes brownian4 {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        25%      { transform: translate3d(6px, -7px, 0) rotate(2deg); }
        50%      { transform: translate3d(-6px, 6px, 0) rotate(-1.5deg); }
        75%      { transform: translate3d(7px, 4px, 0) rotate(1deg); }
      }
      @keyframes marqueeLTR {
        0%   { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }
      @keyframes vibrate {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        2%       { transform: translate3d(-2px, 1.5px, 0) rotate(-1.5deg); }
        4%       { transform: translate3d(2.5px, -1.5px, 0) rotate(2deg); }
        6%       { transform: translate3d(-2.5px, -1px, 0) rotate(-1deg); }
        8%       { transform: translate3d(2px, 2px, 0) rotate(1.5deg); }
        10%      { transform: translate3d(-1.5px, 0.5px, 0) rotate(-1deg); }
        12%      { transform: translate3d(1.5px, -1px, 0) rotate(1deg); }
        14%      { transform: translate3d(-1px, 1px, 0) rotate(-0.5deg); }
        16%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      }

      /* Neumorphic utility classes */
      .neo        { background: #dde8ea; }
      .neo-raised { background: #dde8ea; box-shadow: 6px 6px 14px #b8c6c9, -6px -6px 14px #ffffff; }
      .neo-raised-sm { background: #dde8ea; box-shadow: 3px 3px 8px #b8c6c9, -3px -3px 8px #ffffff; }
      .neo-raised-lg { background: #dde8ea; box-shadow: 10px 10px 24px #b0bec0, -10px -10px 24px #ffffff; }
      .neo-inset  { background: #dde8ea; box-shadow: inset 4px 4px 10px #b8c6c9, inset -4px -4px 10px #ffffff; }
      .neo-inset-sm { background: #dde8ea; box-shadow: inset 2px 2px 6px #b8c6c9, inset -2px -2px 6px #ffffff; }
      .neo-inset-lg { background: #dde8ea; box-shadow: inset 6px 6px 16px #b0bec0, inset -6px -6px 16px #ffffff; }

      /* Teal filled raised */

      /* Tang filled raised */
